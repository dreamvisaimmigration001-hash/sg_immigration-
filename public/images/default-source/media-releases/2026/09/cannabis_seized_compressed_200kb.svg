<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <!-- Background Cardboard/Table texture -->
    <linearGradient id="cardboardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#937a5a" />
      <stop offset="50%" stop-color="#80684a" />
      <stop offset="100%" stop-color="#725b3e" />
    </linearGradient>
    
    <!-- Herb Texture in Vacuum Pack -->
    <pattern id="herbPattern" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#3f4531" />
      <circle cx="3" cy="3" r="1.5" fill="#4d533b" />
      <circle cx="8" cy="7" r="2" fill="#2d3220" />
      <circle cx="4" cy="9" r="1.2" fill="#585e43" />
      <circle cx="10" cy="2" r="1" fill="#676d4e" />
    </pattern>

    <!-- Plastic Sheen Gradient -->
    <linearGradient id="plasticSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
      <stop offset="30%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="70%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>

  <!-- Table Base -->
  <rect width="600" height="350" fill="url(#cardboardBg)" />
  
  <!-- Subtle wood/cardboard lines -->
  <line x1="0" y1="80" x2="600" y2="80" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" />
  <line x1="0" y1="260" x2="600" y2="260" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" />

  <!-- Grid of Vacuum-Sealed Bundles (Top Row: 5 bundles, Bottom Row: 5 bundles) -->
  
  <!-- ROW 1 -->
  <!-- Bundle 1 -->
  <g transform="translate(18, 25)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 10 20 Q 30 50, 20 90 T 40 135" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" />
    <path d="M 60 15 Q 85 60, 75 110" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
  </g>

  <!-- Bundle 2 -->
  <g transform="translate(132, 25)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 20 15 Q 45 60, 35 120" stroke="rgba(255,255,255,0.45)" stroke-width="2" fill="none" />
    <path d="M 70 30 Q 90 80, 80 130" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
  </g>

  <!-- Bundle 3 -->
  <g transform="translate(246, 25)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 15 25 Q 50 70, 30 115" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" />
  </g>

  <!-- Bundle 4 -->
  <g transform="translate(360, 25)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 25 15 Q 60 80, 50 135" stroke="rgba(255,255,255,0.45)" stroke-width="2" fill="none" />
  </g>

  <!-- Bundle 5 -->
  <g transform="translate(474, 25)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 15 30 Q 40 70, 25 120" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" />
  </g>

  <!-- ROW 2 -->
  <!-- Bundle 6 -->
  <g transform="translate(18, 180)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 20 20 Q 50 65, 35 125" stroke="rgba(255,255,255,0.45)" stroke-width="2" fill="none" />
  </g>

  <!-- Bundle 7 -->
  <g transform="translate(132, 180)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 30 15 Q 70 70, 50 130" stroke="rgba(255,255,255,0.45)" stroke-width="2" fill="none" />
  </g>

  <!-- Bundle 8 -->
  <g transform="translate(246, 180)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 15 25 Q 45 75, 25 120" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" />
  </g>

  <!-- Bundle 9 -->
  <g transform="translate(360, 180)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 25 20 Q 60 70, 40 130" stroke="rgba(255,255,255,0.45)" stroke-width="2" fill="none" />
  </g>

  <!-- Bundle 10 -->
  <g transform="translate(474, 180)">
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#herbPattern)" stroke="#2b301f" stroke-width="1.5" />
    <rect x="0" y="0" width="102" height="142" rx="4" fill="url(#plasticSheen)" />
    <rect x="0" y="0" width="12" height="24" fill="#0284c7" opacity="0.85" />
    <path d="M 20 25 Q 55 75, 35 125" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" />
  </g>
</svg>
