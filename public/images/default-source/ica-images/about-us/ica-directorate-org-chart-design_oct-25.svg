        <rect width="170" height="98" rx="9" fill="#eef7ee" stroke="#b2d8b5" stroke-width="2" filter="url(#shadow)"/>
        <text x="85" y="30" fill="#1b2a6b" font-size="16" font-weight="700" text-anchor="middle">Director</text>
        <text x="85" y="50" fill="#333333" font-size="13" font-weight="500" text-anchor="middle">(Logistics,</text>
        <text x="85" y="66" fill="#333333" font-size="13" font-weight="500" text-anchor="middle">Infrastructure &amp;</text>
        <text x="85" y="82" fill="#333333" font-size="13" font-weight="500" text-anchor="middle">Finance)</text>
      </g>

      <line x1="85" y1="220" x2="85" y2="244" stroke="#606060" stroke-width="2.5"/>

      <!-- Director (Corporate Communications & Service) -->
      <g transform="translate(0, 244)">
        <rect width="170" height="98" rx="9" fill="#eef7ee" stroke="#b2d8b5" stroke-width="2" filter="url(#shadow)"/>
        <text x="85" y="30" fill="#1b2a6b" font-size="16" font-weight="700" text-anchor="middle">Director</text>
        <text x="85" y="50" fill="#333333" font-size="13" font-weight="500" text-anchor="middle">(Corporate</text>
        <text x="85" y="66" fill="#333333" font-size="13" font-weight="500" text-anchor="middle">Communications</text>
        <text x="85" y="82" fill="#333333" font-size="13" font-weight="500" text-anchor="middle">&amp; Service)</text>
