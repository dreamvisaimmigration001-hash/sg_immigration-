    <!-- Line Unit Badge -->
    <g transform="translate(0, 38)">
      <rect width="145" height="48" rx="8" fill="#f4f8fc" stroke="#7b90a8" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="72.5" y="30" fill="#1b2a6b" font-size="16" font-weight="500" text-anchor="middle">Line Unit</text>
    </g>

    <!-- Specialist Staff Unit Badge -->
    <g transform="translate(165, 38)">
      <rect width="210" height="48" rx="8" fill="#faeedd" stroke="#e4caa7" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="105" y="30" fill="#1b2a6b" font-size="16" font-weight="500" text-anchor="middle">Specialist Staff Unit</text>
    </g>

    <!-- Staff Unit Badge -->
    <g transform="translate(395, 38)">
      <rect width="145" height="48" rx="8" fill="#eef7ee" stroke="#b2d8b5" stroke-width="1.8" filter="url(#shadow)"/>
      <text x="72.5" y="30" fill="#1b2a6b" font-size="16" font-weight="500" text-anchor="middle">Staff Unit</text>
    </g>
