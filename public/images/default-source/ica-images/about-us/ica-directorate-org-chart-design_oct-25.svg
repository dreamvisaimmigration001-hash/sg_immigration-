<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 830" width="100%" height="auto" style="background:#ffffff; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Enhanced Shadow for Cards -->
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ================= TOP: COMMISSIONER, ICA ================= -->
  <g transform="translate(660, 20)">
    <rect width="300" height="88" rx="10" fill="#1b2a6b" filter="url(#shadow)"/>
    <text x="150" y="52" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">Commissioner, ICA</text>
  </g>

  <!-- Connectors from Commissioner to DCs -->
  <line x1="810" y1="108" x2="810" y2="146" stroke="#606060" stroke-width="2.5"/>
  <line x1="330" y1="146" x2="1300" y2="146" stroke="#606060" stroke-width="2.5"/>

  <!-- Vertical drop lines to 3 DC boxes -->
  <line x1="330" y1="146" x2="330" y2="174" stroke="#606060" stroke-width="2.5"/>
  <line x1="865" y1="146" x2="865" y2="174" stroke="#606060" stroke-width="2.5"/>
  <line x1="1300" y1="146" x2="1300" y2="174" stroke="#606060" stroke-width="2.5"/>

  <!-- ================= COLUMN 1: DEPUTY COMMISSIONER (OPERATIONS) ================= -->
  <g transform="translate(30, 174)">
    <!-- DC Operations Header Banner -->
    <rect width="600" height="84" rx="8" fill="#1b2a6b" filter="url(#shadow)"/>
    <text x="300" y="38" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Deputy Commissioner</text>
    <text x="300" y="63" fill="#e0e6f8" font-size="17" font-weight="500" text-anchor="middle">(Operations)</text>

    <!-- Connector lines under DC Operations -->
    <line x1="300" y1="84" x2="300" y2="114" stroke="#606060" stroke-width="2.5"/>
    <line x1="70" y1="114" x2="520" y2="114" stroke="#606060" stroke-width="2.5"/>

    <!-- Drops to 4 sub-branches -->
    <line x1="70" y1="114" x2="70" y2="140" stroke="#606060" stroke-width="2.5"/>
    <line x1="220" y1="114" x2="220" y2="140" stroke="#606060" stroke-width="2.5"/>
    <line x1="370" y1="114" x2="370" y2="140" stroke="#606060" stroke-width="2.5"/>
    <line x1="520" y1="114" x2="520" y2="140" stroke="#606060" stroke-width="2.5"/>

    <!-- Branch 1.1: Operations / Intelligence / Enforcement -->
    <g transform="translate(0, 140)">
      <!-- Director (Operations) -->
      <rect width="140" height="98" rx="9" fill="#eef7ee" stroke="#b2d8b5" stroke-width="2" filter="url(#shadow)"/>
      <text x="70" y="44" fill="#1b2a6b" font-size="17" font-weight="700" text-anchor="middle">Director</text>
      <text x="70" y="68" fill="#333333" font-size="15.5" font-weight="500" text-anchor="middle">(Operations)</text>

      <line x1="70" y1="98" x2="70" y2="122" stroke="#606060" stroke-width="2.5"/>

      <!-- Director (Intelligence) -->
      <g transform="translate(0, 122)">
        <rect width="140" height="98" rx="9" fill="#faeedd" stroke="#e4caa7" stroke-width="2" filter="url(#shadow)"/>
        <text x="70" y="44" fill="#1b2a6b" font-size="17" font-weight="700" text-anchor="middle">Director</text>
        <text x="70" y="68" fill="#333333" font-size="15.5" font-weight="500" text-anchor="middle">(Intelligence)</text>
      </g>

      <line x1="70" y1="220" x2="70" y2="244" stroke="#606060" stroke-width="2.5"/>

      <!-- Director (Enforcement) -->
      <g transform="translate(0, 244)">
        <rect width="140" height="98" rx="9" fill="#faeedd" stroke="#e4caa7" stroke-width="2" filter="url(#shadow)"/>
        <text x="70" y="44" fill="#1b2a6b" font-size="17" font-weight="700" text-anchor="middle">Director</text>
        <text x="70" y="68" fill="#333333" font-size="15.5" font-weight="500" text-anchor="middle">(Enforcement)</text>
      </g>
