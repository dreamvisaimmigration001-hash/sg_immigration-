    <text x="180" y="38" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Deputy Commissioner</text>
    <text x="180" y="63" fill="#e0e6f8" font-size="16.5" font-weight="500" text-anchor="middle">(Policy &amp; Transformation)</text>

    <!-- Connector lines -->
    <line x1="180" y1="84" x2="180" y2="114" stroke="#606060" stroke-width="2.5"/>
    <line x1="75" y1="114" x2="285" y2="114" stroke="#606060" stroke-width="2.5"/>

    <line x1="75" y1="114" x2="75" y2="140" stroke="#606060" stroke-width="2.5"/>
    <line x1="285" y1="114" x2="285" y2="140" stroke="#606060" stroke-width="2.5"/>

    <!-- Sub-column 2.1 -->
    <g transform="translate(0, 140)">
      <!-- Director (Immigration and Registration) -->
      <rect width="150" height="98" rx="9" fill="#f4f8fc" stroke="#7b90a8" stroke-width="2" filter="url(#shadow)"/>
      <text x="75" y="32" fill="#1b2a6b" font-size="16.5" font-weight="700" text-anchor="middle">Director</text>
      <text x="75" y="54" fill="#333333" font-size="14.5" font-weight="500" text-anchor="middle">(Immigration</text>
      <text x="75" y="74" fill="#333333" font-size="14.5" font-weight="500" text-anchor="middle">and Registration)</text>

      <line x1="75" y1="98" x2="75" y2="122" stroke="#606060" stroke-width="2.5"/>

      <!-- Director (Customer Operations) -->
      <g transform="translate(0, 122)">
        <rect width="150" height="98" rx="9" fill="#f4f8fc" stroke="#7b90a8" stroke-width="2" filter="url(#shadow)"/>
        <text x="75" y="34" fill="#1b2a6b" font-size="16.5" font-weight="700" text-anchor="middle">Director</text>
        <text x="75" y="57" fill="#333333" font-size="15" font-weight="500" text-anchor="middle">(Customer</text>
        <text x="75" y="76" fill="#333333" font-size="15" font-weight="500" text-anchor="middle">Operations)</text>
      </g>

      <line x1="75" y1="220" x2="75" y2="244" stroke="#606060" stroke-width="2.5"/>

      <!-- Director (Services) -->
      <g transform="translate(0, 244)">
        <rect width="150" height="98" rx="9" fill="#f4f8fc" stroke="#7b90a8" stroke-width="2" filter="url(#shadow)"/>
        <text x="75" y="34" fill="#1b2a6b" font-size="16.5" font-weight="700" text-anchor="middle">Director</text>
        <text x="75" y="57" fill="#333333" font-size="14.5" font-weight="500" text-anchor="middle">(Immigration</text>
        <text x="75" y="76" fill="#333333" font-size="14.5" font-weight="500" text-anchor="middle">Services)</text>
      </g>
    </g>

    <!-- Sub-column 2.2 -->
    <g transform="translate(210, 140)">
      <!-- Director (Planning & Review) -->
      <rect width="150" height="98" rx="9" fill="#f4f8fc" stroke="#7b90a8" stroke-width="2" filter="url(#shadow)"/>
      <text x="75" y="34" fill="#1b2a6b" font-size="16.5" font-weight="700" text-anchor="middle">Director</text>
      <text x="75" y="57" fill="#333333" font-size="15" font-weight="500" text-anchor="middle">(Planning &amp;</text>
      <text x="75" y="76" fill="#333333" font-size="15" font-weight="500" text-anchor="middle">Review)</text>

      <line x1="75" y1="98" x2="75" y2="122" stroke="#606060" stroke-width="2.5"/>

      <!-- Director (Policy & Development) -->
      <g transform="translate(0, 122)">
        <rect width="150" height="98" rx="9" fill="#f4f8fc" stroke="#7b90a8" stroke-width="2" filter="url(#shadow)"/>
        <text x="75" y="34" fill="#1b2a6b" font-size="16.5" font-weight="700" text-anchor="middle">Director</text>
        <text x="75" y="57" fill="#333333" font-size="15" font-weight="500" text-anchor="middle">(Policy &amp;</text>
        <text x="75" y="76" fill="#333333" font-size="15" font-weight="500" text-anchor="middle">Development)</text>
      </g>
    </g>
  </g>

