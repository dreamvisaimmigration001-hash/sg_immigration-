    <text x="252" y="38" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">Deputy Commissioner</text>
    <text x="252" y="63" fill="#e0e6f8" font-size="16.5" font-weight="500" text-anchor="middle">(Capability &amp; Technology Development)</text>

    <!-- Connector lines -->
    <line x1="252" y1="84" x2="252" y2="114" stroke="#606060" stroke-width="2.5"/>
    <line x1="85" y1="114" x2="340" y2="114" stroke="#606060" stroke-width="2.5"/>

    <line x1="85" y1="114" x2="85" y2="140" stroke="#606060" stroke-width="2.5"/>
    <line x1="340" y1="114" x2="340" y2="140" stroke="#606060" stroke-width="2.5"/>

    <!-- Sub-column 3.1 (Green cards) -->
    <g transform="translate(0, 140)">
      <!-- Director (Manpower) -->
      <rect width="170" height="98" rx="9" fill="#eef7ee" stroke="#b2d8b5" stroke-width="2" filter="url(#shadow)"/>
      <text x="85" y="44" fill="#1b2a6b" font-size="17" font-weight="700" text-anchor="middle">Director</text>
      <text x="85" y="68" fill="#333333" font-size="15.5" font-weight="500" text-anchor="middle">(Manpower)</text>

      <line x1="85" y1="98" x2="85" y2="122" stroke="#606060" stroke-width="2.5"/>

      <!-- Director (Data) -->
      <g transform="translate(0, 122)">
        <rect width="170" height="98" rx="9" fill="#eef7ee" stroke="#b2d8b5" stroke-width="2" filter="url(#shadow)"/>
        <text x="85" y="44" fill="#1b2a6b" font-size="17" font-weight="700" text-anchor="middle">Director</text>
        <text x="85" y="68" fill="#333333" font-size="15.5" font-weight="500" text-anchor="middle">(Data)</text>
      </g>

      <line x1="85" y1="220" x2="85" y2="244" stroke="#606060" stroke-width="2.5"/>

      <!-- Director (Operations Technology) -->
      <g transform="translate(0, 244)">
        <rect width="170" height="98" rx="9" fill="#eef7ee" stroke="#b2d8b5" stroke-width="2" filter="url(#shadow)"/>
        <text x="85" y="34" fill="#1b2a6b" font-size="17" font-weight="700" text-anchor="middle">Director</text>
        <text x="85" y="57" fill="#333333" font-size="15" font-weight="500" text-anchor="middle">(Operations</text>
        <text x="85" y="76" fill="#333333" font-size="15" font-weight="500" text-anchor="middle">Technology)</text>
      </g>
    </g>

    <!-- Sub-column 3.2 (Green cards) -->
    <g transform="translate(255, 140)">
      <!-- Commander (Training) -->
      <rect width="170" height="98" rx="9" fill="#eef7ee" stroke="#b2d8b5" stroke-width="2" filter="url(#shadow)"/>
      <text x="85" y="44" fill="#1b2a6b" font-size="17" font-weight="700" text-anchor="middle">Commander</text>
      <text x="85" y="68" fill="#333333" font-size="15.5" font-weight="500" text-anchor="middle">(Training)</text>

      <line x1="85" y1="98" x2="85" y2="122" stroke="#606060" stroke-width="2.5"/>

      <!-- Director (Logistics, Infrastructure & Finance) -->
