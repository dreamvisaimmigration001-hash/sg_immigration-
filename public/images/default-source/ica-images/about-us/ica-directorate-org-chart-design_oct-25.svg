      <rect width="140" height="98" rx="9" fill="#f4f8fc" stroke="#7b90a8" stroke-width="2" filter="url(#shadow)"/>
      <text x="70" y="34" fill="#1b2a6b" font-size="16" font-weight="700" text-anchor="middle">Domain</text>
      <text x="70" y="54" fill="#1b2a6b" font-size="16" font-weight="700" text-anchor="middle">Commander</text>
      <text x="70" y="77" fill="#333333" font-size="15.5" font-weight="500" text-anchor="middle">(Air)</text>

      <line x1="70" y1="98" x2="70" y2="122" stroke="#606060" stroke-width="2.5"/>

